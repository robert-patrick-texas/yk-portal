# yk-portal lab: http-level definitions for snippets/yk-portal-lab.conf
# (lab/README.md). Installed as /etc/nginx/conf.d/yk-portal-lab.conf, which
# Ubuntu's nginx.conf loads inside its http { } block. On its own it changes
# nothing. As deploy/nginx/yk-portal-path.conf, for the lab's port.

# Sign-in attempts per client address (spec §18.2).
limit_req_zone $binary_remote_addr zone=yk_portal_lab_login:10m rate=10r/m;

# The lab container's published port: YK_LAB_PORT in lab/lab.env. While the
# lab is down, its path answers 502.
upstream yk_portal_lab {
    server 127.0.0.1:8100;
    keepalive 8;
}
