# yk-portal lab at /yk/ on an existing site (lab/README.md). Installed as
# /etc/nginx/snippets/yk-portal-lab.conf, with one line inside the site's
# server { } block:
#
#     include snippets/yk-portal-lab.conf;
#
# Needs the upstream and zone in /etc/nginx/conf.d/yk-portal-lab.conf. As
# deploy/nginx/yk-portal-path.conf, for the lab's upstream. /yk is the path of
# YK_LAB_PUBLIC_BASE_URL in lab/lab.env: change it here to match.

location = /yk {
    absolute_redirect off;
    return 301 /yk/;
}

# ^~ keeps the site's regular-expression locations from claiming yk-portal's
# pages and static files. The trailing "/" of proxy_pass strips /yk.
location ^~ /yk/ {
    proxy_pass http://yk_portal_lab/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # yk-portal believes these only from the lab network's gateway, where
    # Docker's port forwarding connects from. $remote_addr replaces any
    # X-Forwarded-For the client sent.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 256k;
}

location = /yk/login/ {
    limit_req zone=yk_portal_lab_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://yk_portal_lab/login/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    client_max_body_size 256k;
}

# Local monitoring asks the container directly, at YK_LAB_PORT:
# curl http://127.0.0.1:8100/health/ready
location ^~ /yk/health/ {
    return 404;
}
