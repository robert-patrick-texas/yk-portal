[project]
name = "yk-portal"
version = "0.1.0"
description = "Web portal to manage user accounts and YubiKey OTP credentials, alongside radiator-yubikey"
authors = [
    { name = "Robert Patrick", email = "193846785+robert-patrick-texas@users.noreply.github.com" }
]
requires-python = ">=3.14.4"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "django>=5.2.18,<5.3",
    "gunicorn>=26.2.0",
    "psycopg>=3.3.6",
    "whitenoise>=6.12.0",
]

[project.scripts]
yk-portal = "yk_portal:main"

[project.optional-dependencies]
postgresql-c = [
    "psycopg[c]>=3.3.6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "pages" },
    "django-stubs>=5.2,<5.3",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
    "ty>=0.0.88",
]
pages = [
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
]

[tool.uv]
required-version = ">=0.13.1"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "yk_portal.settings.test"
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]  # asserts; tests run openssl and perl

[tool.ty.terminal]
error-on-warning = true
