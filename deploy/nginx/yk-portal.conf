# yk-portal behind nginx, on a host name of its own (spec §32; docs/deployment.md,
# "Reverse proxy"). Install as /etc/nginx/conf.d/yk-portal.conf, set server_name
# and the certificate, then: sudo nginx -t && sudo systemctl reload nginx
#
# public_base_url in /etc/yk-portal/config.toml is https://yk-portal.example.com.
# To publish yk-portal under a path of an existing site instead, see
# yk-portal-path.conf.

# Sign-in attempts per client address, before yk-portal's own limit on failed
# sign-ins (spec §18.2): 10 a minute, in bursts of up to 10.
limit_req_zone $binary_remote_addr zone=yk_portal_login:10m rate=10r/m;

upstream yk_portal {
    server 127.0.0.1:8000;  # listen_address and listen_port
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name yk-portal.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yk-portal.example.com;

    # The enterprise's certificate (spec §4.2), with its chain.
    ssl_certificate     /etc/ssl/certs/yk-portal.example.com.pem;
    ssl_certificate_key /etc/ssl/private/yk-portal.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    # yk-portal's largest form is a few KiB; it refuses more than 256 KiB itself.
    client_max_body_size 256k;

    # yk-portal sets the security headers (Content-Security-Policy, HSTS,
    # X-Frame-Options, ...) and the caching of every response: don't add them
    # here as well.

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # $remote_addr replaces any X-Forwarded-For the client sent, so it can't
    # choose its address. yk-portal believes these headers only from the
    # addresses in trusted_proxy_addresses.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://yk_portal;
    }

    location = /login/ {
        limit_req zone=yk_portal_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://yk_portal;
    }

    # For local monitoring, which asks the application directly (spec §41).
    location /health/ {
        return 404;
    }
}
