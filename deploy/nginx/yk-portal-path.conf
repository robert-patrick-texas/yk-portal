# yk-portal under a path of an existing site, here /yk/ (addendum §20.2;
# docs/deployment.md, "Under a path"). public_base_url in
# /etc/yk-portal/config.toml is then https://www.example.com/yk.
#
# Two parts: the first goes in the http { } context, for example as
# /etc/nginx/conf.d/yk-portal.conf; the second inside the site's server { }
# block, for example as /etc/nginx/snippets/yk-portal.conf with this line in
# the block:
#
#     include snippets/yk-portal.conf;
#
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# yk-portal then shares the site's origin: any page of the site can read
# yk-portal's pages with the user's session. Publish it under a path only on a
# site whose other pages are trusted as much; a host name of its own
# (yk-portal.conf) keeps it apart.

# --- http { } context ------------------------------------------------------

limit_req_zone $binary_remote_addr zone=yk_portal_login:10m rate=10r/m;

upstream yk_portal {
    server 127.0.0.1:8000;  # listen_address and listen_port
    keepalive 8;
}

# --- the site's server { } block --------------------------------------------

location = /yk {
    absolute_redirect off;
    return 301 /yk/;
}

# ^~ keeps the site's regular-expression locations from claiming yk-portal's
# pages and static files. The trailing "/" of proxy_pass strips /yk: yk-portal
# puts it back in its links and cookies.
location ^~ /yk/ {
    proxy_pass http://yk_portal/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 256k;
}

location = /yk/login/ {
    limit_req zone=yk_portal_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://yk_portal/login/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    client_max_body_size 256k;
}

location ^~ /yk/health/ {
    return 404;
}
